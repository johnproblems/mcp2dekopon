[package]
name = "mcp2dekopon"
version = "0.1.0"
edition = "2021"
description = "Generate Dekopon providers from MCP servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon"
readme = "README.md"

[lib]
name = "mcp2dekopon"
path = "src/lib.rs"

[[bin]]
name = "mcp2dekopon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
