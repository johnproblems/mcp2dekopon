[package]
name = "mcp2dekopon"
version = "0.1.0"
edition = "2021"
description = "Generate Dekopon providers from MCP servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnproblems/mcp2dekopon"
readme = "README.md"
keywords = ["mcp", "mcp-server", "dekopon", "codegen"]
categories = ["command-line-utilities"]
# The crate embeds wit-0461/ via include_str!, and the test suite reads
# scripts/, .github/, README.md, PRD.md, and docs/; all must ship.
include = [
    "src/**",
    "tests/**",
    "wit-0461/**",
    "scripts/**",
    ".github/**",
    "docs/**",
    "README.md",
    "PRD.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "mcp2dekopon"
path = "src/lib.rs"

[[bin]]
name = "mcp2dekopon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
